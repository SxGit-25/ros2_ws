/**:
  ros__parameters:
    rf2o_odom_topic: /odom_rf2o
    scan_topic: /scan
    # Positive is counter-clockwise from laser frame to base_link.
    # Current field estimate: laser zero is roughly aligned with body -x, so initialize
    # the fixed laser->base yaw to about -175 deg for the N10 installation.
    laser_to_base_yaw_deg: -49.0
    odom_candidate_topic: /radar/odom_candidate
    vel_candidate_topic: /radar/vel_candidate
    imu_candidate_topic: /observation/imu_candidate_state
    enhanced_vel_candidate_topic: /radar/vel_candidate_enhanced
    match_quality_topic: /radar/match_quality
    match_quality_after_imu_topic: /radar/match_quality_after_imu
    odom_status_topic: /radar/odom_status
    match_debug_topic: /radar/match_debug
    imu_enhanced_status_topic: /radar/imu_enhanced_status
    imu_enhanced_debug_topic: /radar/imu_enhanced_debug
    min_dt_sec: 0.04
    max_dt_sec: 0.20
    odom_stale_timeout_sec: 0.50
    scan_stale_timeout_sec: 0.50
    max_speed_mps: 1.20
    warn_speed_mps: 0.80
    max_yaw_rate_rps: 1.20
    warn_yaw_rate_rps: 0.80
    max_pose_jump_m: 0.25
    max_yaw_jump_deg: 20.0
    static_speed_threshold_mps: 0.05
    static_yaw_rate_threshold_rps: 0.08
    baseline_window_size: 100
    jitter_window_size: 20
    velocity_window_size: 5
    static_false_motion_trigger_frames: 8
    static_false_motion_clear_frames: 5
    static_jitter_speed_std_threshold: 0.04
    moving_jitter_speed_std_threshold: 0.12
    static_jitter_yaw_std_threshold: 0.08
    moving_jitter_yaw_std_threshold: 0.20
    quality_low_confidence_threshold: 0.45
    quality_valid_threshold: 0.62
    imu_stationary_enter_gyro_threshold: 120.0
    imu_stationary_exit_gyro_threshold: 180.0
    imu_stationary_enter_acc_delta_threshold: 180.0
    imu_stationary_exit_acc_delta_threshold: 260.0
    imu_stationary_hold_frames: 8
    imu_stationary_release_frames: 4
    imu_radar_consistency_speed_threshold: 0.08
    imu_radar_consistency_yaw_threshold: 0.12
    high_rotation_penalty_threshold: 220.0
    imu_acc_reference_window_size: 40
    imu_stale_timeout_sec: 0.5
    log_hz: 1.0
    baseline_log_hz: 0.5
